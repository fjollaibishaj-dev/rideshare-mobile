
<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#be3455">
  <title>RideShare - Offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      text-align: center;
      color: #172033;
      background: #f7e9ed;
    }

    main {
      max-width: 420px;
      padding: 32px;
      border-radius: 20px;
      background: white;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      color: #be3455;
    }

    p {
      line-height: 1.6;
    }

    a {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 20px;
      border-radius: 10px;
      color: white;
      background: #be3455;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Je offline</h1>
    <p>Nuk ke lidhje me internetin për momentin.</p>
    <p>Udhëtimet e ruajtura më parë mund të jenë ende të disponueshme.</p>
    <a href="/">Provo përsëri</a>
  </main>
</body>
</html>
